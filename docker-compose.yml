services:
  web:
    image: nginx:latest
    ports:
      - "${WEB_HOST}:${WEB_PORT}:80"
      - "${WEB_HOST}:${REVERSE_PROXY_PORT}:8082"
    volumes:
      - ./website:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - frontend
      - backend
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "service", "nginx", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  db:
    image: postgres:latest
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_PASSWORD: "${DB_PASSWORD}"  # Use environment variable
      POSTGRES_USER: "${DB_USER}"          # Use environment variable
      POSTGRES_DB: "${DB_NAME}"            # Use environment variable
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 5s
      retries: 3

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    ports:
      - "${N8N_PORT}:5678"
    environment:
      - N8N_HOST=${SERVICE_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - NODE_ENV=production
      - N8N_ENCRYPTION_KEY="${N8N_ENCRYPTION_KEY}"  # Use environment variable
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_CORS_ENABLED=true
      - N8N_CORS_ALLOW_ORIGIN="${N8N_CORS_ORIGIN:-http://localhost:8080}"
      # Enable public API access (for dev environment)
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_PUBLIC_API_SWAGGERUI_DISABLED=false
      # Auto-setup configuration
      - N8N_SETUP_EMAIL=${N8N_SETUP_EMAIL:-admin@aletheia.local}
      - N8N_SETUP_PASSWORD=${N8N_SETUP_PASSWORD:-admin123}
      - N8N_SETUP_FIRSTNAME=${N8N_SETUP_FIRSTNAME:-Admin}
      - N8N_SETUP_LASTNAME=${N8N_SETUP_LASTNAME:-User}
      - EXECUTIONS_TIMEOUT=600  # 10 minutes
      - EXECUTIONS_TIMEOUT_MAX=3600  # 1 hour
      - N8N_CUSTOM_EXTENSIONS=/data/.n8n/custom
      # Database connection (for workflows to access)
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_PORT=${POSTGRES_PORT}
      # Redis connection
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Court Processor API
      - COURT_API_BASE_URL=${COURT_API_BASE_URL}
      - COURT_PROCESSOR_PORT=${COURT_PROCESSOR_PORT}
      # SMTP settings (if needed in workflows)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # Other service URLs
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
      - NEXT_PUBLIC_AI_PORTAL_URL=${NEXT_PUBLIC_AI_PORTAL_URL}
      - N8N_WEBHOOK_ID=${N8N_WEBHOOK_ID}
    volumes:
      - n8n_data:/data
      - ./n8n/local-files:/files
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  court-processor:
    build:
      context: ./court-processor
      dockerfile: Dockerfile
    environment:
      # Use individual DB variables to avoid password escaping issues
      PYTHONPATH: /app
      COURTLISTENER_API_TOKEN: ${COURTLISTENER_API_TOKEN}
      PACER_USERNAME: ${PACER_USERNAME}
      PACER_PASSWORD: ${PACER_PASSWORD}
      RECAP_WEBHOOK_URL: http://recap-webhook:5000/webhook/recap-fetch
      # Database configuration for simplified_api.py
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SIMPLE_API_PORT: 8104
    ports:
      - "8104:8104"  # Expose simplified API for browser access
    volumes:
      - ./court-data/pdfs:/data/pdfs
      - ./court-data/logs:/data/logs
      - ./court-processor:/app
    depends_on:
      - db
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8104/"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # recap-webhook service commented out - API consolidated into court-processor
  # recap-webhook:
  #   build:
  #     context: ./court-processor/api
  #     dockerfile: Dockerfile
  #   environment:
  #     COURTLISTENER_API_TOKEN: ${COURTLISTENER_API_TOKEN}
  #     RECAP_DOWNLOAD_DIR: /data/recap_downloads
  #     RECAP_WEBHOOK_SECRET: ${RECAP_WEBHOOK_SECRET}
  #     FLASK_ENV: production
  #     PYTHONPATH: /app/court-processor
  #   ports:
  #     - "${RECAP_WEBHOOK_PORT}:5000"
  #   volumes:
  #     - ./court-data/recap_downloads:/data/recap_downloads
  #     - ./court-processor:/app/court-processor
  #   networks:
  #     - backend
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  lawyer-chat:
    build: 
      context: ./services/lawyer-chat
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        NEXT_PUBLIC_ENABLE_DOCUMENT_SELECTION: ${NEXT_PUBLIC_ENABLE_DOCUMENT_SELECTION}
        NEXT_PUBLIC_COURT_API_URL: ${NEXT_PUBLIC_COURT_API_URL}
        NEXT_PUBLIC_MAX_DOCUMENT_SELECTIONS: ${NEXT_PUBLIC_MAX_DOCUMENT_SELECTIONS}
    container_name: lawyer-chat
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - HOSTNAME=${SERVICE_HOST:-0.0.0.0}
      # Direct DATABASE_URL for Prisma (escaped special characters)
      - "DATABASE_URL=postgresql://${DB_USER}:SecurePass123\\!@db:5432/lawyerchat"
      # Keep individual vars for other uses
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=lawyerchat
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:${WEB_PORT}/chat
      - NEXT_PUBLIC_NEXTAUTH_URL=http://localhost:${WEB_PORT}/chat
      - NEXTAUTH_BASE_PATH=${NEXTAUTH_BASE_PATH:-/chat}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
      - NEXT_PUBLIC_AI_PORTAL_URL=${NEXT_PUBLIC_AI_PORTAL_URL}
      - NEXT_PUBLIC_N8N_URL=${NEXT_PUBLIC_N8N_URL}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/${N8N_WEBHOOK_ID}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_API_SECRET=${N8N_API_SECRET}
      - N8N_AUTH_BYPASS=${N8N_AUTH_BYPASS:-false}
      # Court Processor API config
      - COURT_API_BASE_URL=http://court-processor:8104
      - NEXT_PUBLIC_COURT_API_URL=${NEXT_PUBLIC_COURT_API_URL}
      - NEXT_PUBLIC_MAX_DOCUMENT_SELECTIONS=${NEXT_PUBLIC_MAX_DOCUMENT_SELECTIONS}
      - NEXT_PUBLIC_ENABLE_DOCUMENT_SELECTION=${NEXT_PUBLIC_ENABLE_DOCUMENT_SELECTION}
      - NEXT_PUBLIC_N8N_WEBHOOK_URL=/webhook/${N8N_WEBHOOK_ID}
      # Email config
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # Prisma
      - PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING=1
      # Redis config
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - n8n
      - redis
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/chat"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-portal:
    build:
      context: ./services/ai-portal
      dockerfile: Dockerfile
    container_name: ai-portal-app
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
      - NEXT_PUBLIC_AI_PORTAL_URL=${NEXT_PUBLIC_AI_PORTAL_URL}
      - NEXT_PUBLIC_N8N_URL=${NEXT_PUBLIC_N8N_URL}
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3000/\", (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on(\"error\", () => process.exit(1))'"]
      interval: 30s
      timeout: 10s
      retries: 3

  ai-portal-nginx:
    image: nginx:alpine
    container_name: ai-portal-nginx
    restart: unless-stopped
    ports:
      - "${AI_PORTAL_PORT}:80"
    environment:
      - WEB_PORT=${WEB_PORT}
    volumes:
      - ./services/ai-portal/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-portal
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  docker-api:
    build:
      context: ./docker-api
      dockerfile: Dockerfile
    container_name: docker-api
    restart: unless-stopped
    ports:
      - "5002:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - .:/workspace:ro
    networks:
      - frontend
    environment:
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Elasticsearch for document indexing and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.1
    container_name: elasticsearch-judicial
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
      - network.host=0.0.0.0
      - cluster.name=judicial-cluster
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
      - "${ELASTICSEARCH_CLUSTER_PORT:-9300}:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - backend

  # Haystack RAG service for document processing
  haystack-service:
    image: data_compose-haystack-service:latest
    container_name: haystack-judicial
    ports:
      - "${HAYSTACK_PORT:-8000}:8000"
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HAYSTACK_MODE=unified
      - ENABLE_POSTGRESQL=true
      - POSTGRES_HOST=db
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - ELASTICSEARCH_INDEX=legal-documents-rag
    depends_on:
      db:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - haystack_models:/app/models
    networks:
      - backend
    restart: unless-stopped

  # Unstructured service for document parsing
  unstructured-service:
    build:
      context: .
      dockerfile: ./n8n/unstructured-service/Dockerfile
    container_name: unstructured-judicial
    ports:
      - "${UNSTRUCTURED_PORT:-8880}:8880"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:
  redis_data:
  elasticsearch_data:
    driver: local
  haystack_models:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge